<div class="relative" (mouseover)="show = true" (mouseleave)="show = false">
    <ng-content></ng-content>
    <div *ngIf="show" class="absolute bottom-full mb-2 w-100 bg-gray-800 text-white text-sm text-center p-2 rounded">
        {{ text }}
        <div class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-gray-800 rotate-45"></div>
    </div>
</div>
